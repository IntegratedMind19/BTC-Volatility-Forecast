<html>
  <head>
    <meta charset="UTF-8">
    <title>Forecast Explanation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="report-header">
      <a href="{{url_for('index')}}" class="back-button">
        Back
      </a>
      <button id="theme-toggle" class="theme-toggle">
        Dark mode
      </button>
    </header>
    <main class="report-container">
      <h1 class="header-text">
        Forecast Explanation
      </h1>
      <br>
      <section id="loading-screen" hidden>
        <h3>Updating forecast report...</h3>
        <p>Please hang on a second while we are renewing the report. This page will automatically be updated.</p>
      </section>
      <section id="error-screen">
        <h3>An unexpected error occured!</h3>
        <p>Some error has occured in the report generation. We will fix very soon.</p>
      </section>
    </main>
  </body>
</html>
